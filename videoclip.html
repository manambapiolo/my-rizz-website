<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Short Video</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }
        
        .video-container {
            position: relative;
            width: 360px;
            height: 640px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .caption {
            position: absolute;
            bottom: 20px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

<body>

    <div class="video-container">
        <video autoplay loop muted>
        <source src="Short.mp4" type="video/mp4">
        <audio src="Short.mp3" autoplay loop ></audio>
        Your browser does not support the video tag.
    </video>
        <div class="caption">My Short Video – Watch Now!</div>
    </div>

</body>

</html>
